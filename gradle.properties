# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
#
# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# This machine's JVM times out resolving repos over IPv6; force IPv4 for downloads.
systemProp.java.net.preferIPv4Stack=true

# AndroidX package structure, non-transitive R classes for smaller builds.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style for this project.
kotlin.code.style=official

# AGP 8.10.1 predates SDK 36/37; compiling against the newer platform works and
# this silences the warning. 37.0 is listed explicitly because the SDK ships
# platform 37 under that versioned name on this machine.
android.suppressUnsupportedCompileSdk=36,37.0
